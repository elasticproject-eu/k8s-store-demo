# AKS Store Demo — Distributed attestation deployment

# ── documentdb (TCP backend, :10260) ─────────────────────────────────────────
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: documentdb
spec:
  serviceName: documentdb-protocol-service
  replicas: 1
  selector:
    matchLabels: { app: documentdb }
  template:
    metadata:
      labels: { app: documentdb }
      annotations:
        io.containerd.cri.runtime-handler: kata-qemu-tdx
        io.katacontainers.config.hypervisor.cc_init_data: 
        io.katacontainers.config.hypervisor.kernel_params: >-
          agent.guest_components_rest_api=all
          agent.insecure_130.233.195.35:5000=130.233.195.35:5000
    spec:
      enableServiceLinks: false
      runtimeClassName: kata-qemu-tdx
      securityContext: { fsGroup: 1337 }
      initContainers:
        - name: iptables-init
          image: 130.233.195.35:5000/iptables-init@sha256:a33779d0e8e49bd4a65debae3b6833da4d090a2be0d24064014159889be94e67
          securityContext:
            { capabilities: { add: ["NET_ADMIN"] }, runAsNonRoot: false }
          resources:
            requests: { cpu: 5m, memory: 16Mi }
            limits: { cpu: 50m, memory: 32Mi }
      containers:
        - name: peer
          image: 130.233.195.35:5000/p2p-attestation@sha256:9641c0adcdf686cfab28881d06f9257215046488c3a34b7c6fcc77c55a96a238
          command: ["./peer"]
          args: ["--id=$(POD_NAME)"]
          env:
            - name: POD_NAME
              valueFrom: { fieldRef: { fieldPath: metadata.name } }
            - name: REST_PORT
              value: "8888"
          securityContext: { runAsUser: 1337, runAsGroup: 1337 }
          resources:
            requests: { cpu: 20m, memory: 64Mi }
            limits: { cpu: 150m, memory: 128Mi }
          ports: [{ containerPort: 5001 }, { containerPort: 8443 }]
          volumeMounts:
            - { name: config-dir, mountPath: /app/config, readOnly: true }
            - { name: certs-vol, mountPath: /certs }
        - name: envoy
          image: 130.233.195.35:5000/envoy@sha256:e5e530a61bb1ce655fa4a8ec567497112fcad296cb40ef00382ac575e8bd5e64
          command: ["/bin/bash", "-c"]
          args:
            - |
              until (exec 3<>/dev/tcp/127.0.0.1/8888 &&
                     printf "GET /.well-known/attestation HTTP/1.0\r\nHost: 127.0.0.1\r\n\r\n" >&3 &&
                     read -r line <&3 && exec 3>&- &&
                     [[ "$line" == *"200"* ]]) 2>/dev/null; do
                echo "[envoy] waiting for attestation..."; sleep 2
              done
              exec envoy -c /etc/envoy/envoy.yaml --service-node "$POD_NAME" --service-cluster documentdb
          env:
            - name: POD_NAME
              valueFrom: { fieldRef: { fieldPath: metadata.name } }
          securityContext: { runAsUser: 1337, runAsGroup: 1337 }
          resources:
            requests: { cpu: 30m, memory: 64Mi }
            limits: { cpu: 300m, memory: 128Mi }
          ports:
            [
              { containerPort: 9090 },
              { containerPort: 9443 },
              { containerPort: 15006 },
              { containerPort: 15001 },
              { containerPort: 9901 },
            ]
          volumeMounts:
            - { name: envoy-config, mountPath: /etc/envoy, readOnly: true }
            - { name: certs-vol, mountPath: /certs, readOnly: true }
        - name: documentdb
          image: 130.233.195.35:5000/documentdb-local@sha256:7217b1dfcd2fd8b97e1a15153ff90e838b382bc4b33bf5d33d89b6f094b12f7a
          imagePullPolicy: Always
          # Need to run as root, since otherwise it seems like it cannot start
          securityContext: { runAsUser: 0, runAsGroup: 0 }
          args: ["--username", "username", "--password", "password"]
          ports: [{ containerPort: 10260 }]
          resources:
            requests: { cpu: 5m, memory: 75Mi }
            limits: { cpu: 1000m, memory: 768Mi }
      volumes:
        - { name: config-dir, configMap: { name: shared-config } }
        - { name: envoy-config, configMap: { name: envoy-config-documentdb } } # TCP template, app port 10260
        - { name: certs-vol, emptyDir: {} }
---
apiVersion: v1
kind: Service
metadata: { name: documentdb-protocol-service }
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector: { app: documentdb }
  ports: [{ port: 5001 }]
---
apiVersion: v1
kind: Service
metadata: { name: documentdb }
spec:
  type: ClusterIP
  selector: { app: documentdb }
  ports:
    - { name: mtls, port: 10260, targetPort: 15006 }


# ── rabbitmq (TCP backend, :5672) ─────────────────────────────────────────────
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: rabbitmq
spec:
  serviceName: rabbitmq-protocol-service
  replicas: 1
  selector:
    matchLabels: { app: rabbitmq }
  template:
    metadata:
      labels: { app: rabbitmq }
      annotations:
        io.containerd.cri.runtime-handler: kata-qemu-tdx
        io.katacontainers.config.hypervisor.cc_init_data: 
        io.katacontainers.config.hypervisor.kernel_params: >-
          agent.guest_components_rest_api=all
          agent.insecure_130.233.195.35:5000=130.233.195.35:5000
    spec:
      enableServiceLinks: false
      runtimeClassName: kata-qemu-tdx
      securityContext: { fsGroup: 1337 }
      initContainers:
        - name: iptables-init
          image: 130.233.195.35:5000/iptables-init@sha256:a33779d0e8e49bd4a65debae3b6833da4d090a2be0d24064014159889be94e67
          securityContext:
            { capabilities: { add: ["NET_ADMIN"] }, runAsNonRoot: false }
          resources:
            requests: { cpu: 5m, memory: 16Mi }
            limits: { cpu: 50m, memory: 32Mi }
      containers:
        - name: peer
          image: 130.233.195.35:5000/p2p-attestation@sha256:9641c0adcdf686cfab28881d06f9257215046488c3a34b7c6fcc77c55a96a238
          command: ["./peer"]
          args: ["--id=$(POD_NAME)"]
          env:
            - name: POD_NAME
              valueFrom: { fieldRef: { fieldPath: metadata.name } }
            - name: REST_PORT
              value: "8888"
          securityContext: { runAsUser: 1337, runAsGroup: 1337 }
          resources:
            requests: { cpu: 20m, memory: 64Mi }
            limits: { cpu: 150m, memory: 128Mi }
          ports: [{ containerPort: 5001 }, { containerPort: 8443 }]
          volumeMounts:
            - { name: config-dir, mountPath: /app/config, readOnly: true }
            - { name: certs-vol, mountPath: /certs }
        - name: envoy
          image: 130.233.195.35:5000/envoy@sha256:e5e530a61bb1ce655fa4a8ec567497112fcad296cb40ef00382ac575e8bd5e64
          imagePullPolicy: Always
          command: ["/bin/bash", "-c"]
          args:
            - |
              until (exec 3<>/dev/tcp/127.0.0.1/8888 &&
                     printf "GET /.well-known/attestation HTTP/1.0\r\nHost: 127.0.0.1\r\n\r\n" >&3 &&
                     read -r line <&3 && exec 3>&- &&
                     [[ "$line" == *"200"* ]]) 2>/dev/null; do
                echo "[envoy] waiting for attestation..."; sleep 2
              done
              exec envoy -c /etc/envoy/envoy.yaml --service-node "$POD_NAME" --service-cluster rabbitmq
          env:
            - name: POD_NAME
              valueFrom: { fieldRef: { fieldPath: metadata.name } }
          securityContext: { runAsUser: 1337, runAsGroup: 1337 }
          resources:
            requests: { cpu: 30m, memory: 64Mi }
            limits: { cpu: 300m, memory: 128Mi }
          ports:
            [
              { containerPort: 9090 },
              { containerPort: 9443 },
              { containerPort: 15006 },
              { containerPort: 15001 },
              { containerPort: 9901 },
            ]
          volumeMounts:
            - { name: envoy-config, mountPath: /etc/envoy, readOnly: true }
            - { name: certs-vol, mountPath: /certs, readOnly: true }
        - name: rabbitmq
          image: 130.233.195.35:5000/rabbitmq@sha256:174d4359f756f007857cf382b683753277f1e87b272c65d672bc7ed89e8e397a
          ports: [{ containerPort: 5672, name: rabbitmq-amqp }]
          env:
            - { name: RABBITMQ_DEFAULT_USER, value: "username" }
            - { name: RABBITMQ_DEFAULT_PASS, value: "password" }
            # Pin the Erlang node to loopback so epmd/distribution self-traffic
            # stays on 127.0.0.1 (exempt from the mesh redirect). Without this,
            # RabbitMQ connects to its own pod IP for the node, gets redirected
            # into Envoy's mTLS, and fails to start. Single-node only.
            - { name: RABBITMQ_NODENAME, value: "rabbit@localhost" }
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { cpu: 400m, memory: 384Mi }
      volumes:
        - { name: config-dir, configMap: { name: shared-config } }
        - { name: envoy-config, configMap: { name: envoy-config-rabbitmq } } # TCP template, app port 5672
        - { name: certs-vol, emptyDir: {} }
---
apiVersion: v1
kind: Service
metadata: { name: rabbitmq-protocol-service }
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector: { app: rabbitmq }
  ports: [{ port: 5001 }]
---
apiVersion: v1
kind: Service
metadata: { name: rabbitmq }
spec:
  type: ClusterIP
  selector: { app: rabbitmq }
  ports:
    - { name: mtls, port: 5672, targetPort: 15006 }


