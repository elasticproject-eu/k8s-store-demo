---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: documentdb
spec:
  serviceName: documentdb-protocol-service
  replicas: 1
  selector:
    matchLabels:
      app: documentdb
  template:
    metadata:
      labels:
        app: documentdb
      annotations:
        io.containerd.cri.runtime-handler: kata-qemu-tdx
        io.katacontainers.config.hypervisor.default_memory: "4096"
        io.katacontainers.config.hypervisor.cc_init_data: 
        io.katacontainers.config.hypervisor.kernel_params: "agent.guest_components_rest_api=all agent.aa_kbc_params=cc_kbc::130.233.195.35:31401 agent.insecure_registry=130.233.195.35:5000"
    spec:
      enableServiceLinks: false
      runtimeClassName: kata-qemu-tdx
      securityContext:
        fsGroup: 1337
      initContainers:
        - name: iptables-init
          image: "130.233.195.35:5000/iptables-init@sha256:b344b36a6dc756d05f9e21891fe7c82986b4ea809293f3a799d23f6a0a7e8949"
          securityContext:
            capabilities:
              add:
                - NET_ADMIN
            runAsNonRoot: false
          resources:
            requests:
              cpu: 5m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 32Mi
          imagePullPolicy: Always
      containers:
        - name: peer
          image: "130.233.195.35:5000/p2p-attestation@sha256:9641c0adcdf686cfab28881d06f9257215046488c3a34b7c6fcc77c55a96a238"
          command:
            - "./peer"
          args:
            - "--id=$(POD_NAME)"
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: REST_PORT
              value: "8888"
          securityContext:
            runAsUser: 1337
            runAsGroup: 1337
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              cpu: 150m
              memory: 128Mi
          ports:
            - containerPort: 5001
            - containerPort: 8443
          volumeMounts:
            - name: config-dir
              mountPath: /app/config
              readOnly: true
            - name: certs-vol
              mountPath: /certs
          imagePullPolicy: Always
        - name: envoy
          image: "130.233.195.35:5000/envoy@sha256:575e740c2a98ec783358d621d8cca6968c7a8ccbeb1b54799429d6ee944b5900"
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: APP_PORT
              value: "10260"
            - name: ENVOY_MODE
              value: tcp
            - name: REST_PORT
              value: "8888"
            - name: SERVICE_CLUSTER
              value: documentdb
          securityContext:
            runAsUser: 1337
            runAsGroup: 1337
          resources:
            requests:
              cpu: 30m
              memory: 64Mi
            limits:
              cpu: 300m
              memory: 128Mi
          ports:
            - containerPort: 9090
            - containerPort: 9443
            - containerPort: 15006
            - containerPort: 15001
            - containerPort: 9901
          volumeMounts:
            - name: certs-vol
              mountPath: /certs
              readOnly: true
          imagePullPolicy: Always
        - name: documentdb
          image: "130.233.195.35:5000/documentdb-local@sha256:21a711cb66b1a65fca4bfb7a0559f0d910aeee885e434b44b71b2b7097269a20"
          imagePullPolicy: Always
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
          args:
            - "--username"
            - username
            - "--password"
            - password
          env:
            - name: DATA_PATH
              value: /data/pgdata
          ports:
            - containerPort: 10260
          resources:
            requests:
              cpu: 1000m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 768Mi
          volumeMounts:
            - name: documentdb-data
              mountPath: /data
      volumes:
        - name: config-dir
          configMap:
            name: shared-config
        - name: certs-vol
          emptyDir: {}
        - name: documentdb-data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: documentdb-protocol-service
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app: documentdb
  ports:
    - port: 5001
---
apiVersion: v1
kind: Service
metadata:
  name: documentdb
spec:
  type: ClusterIP
  selector:
    app: documentdb
  ports:
    - name: mtls
      port: 10260
      targetPort: 15006
