# ── store-front (frontend, HTTP :8080; external via TLS listener) ─────────────
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: store-front
spec:
  serviceName: store-front-protocol-service
  replicas: 1
  selector:
    matchLabels: { app: store-front }
  template:
    metadata:
      labels: { app: store-front }
      annotations:
        io.containerd.cri.runtime-handler: kata-qemu-tdx
        io.katacontainers.config.hypervisor.cc_init_data: 
        io.katacontainers.config.hypervisor.kernel_params: >-
          agent.guest_components_rest_api=all
          agent.insecure_130.233.195.35:5000=130.233.195.35:5000
    spec:
      enableServiceLinks: false
      runtimeClassName: kata-qemu-tdx
      securityContext: { fsGroup: 1337 }
      initContainers:
        - name: iptables-init
          image: 130.233.195.35:5000/iptables-init@sha256:a33779d0e8e49bd4a65debae3b6833da4d090a2be0d24064014159889be94e67
          securityContext:
            { capabilities: { add: ["NET_ADMIN"] }, runAsNonRoot: false }
          resources:
            requests: { cpu: 5m, memory: 16Mi }
            limits: { cpu: 50m, memory: 32Mi }
      containers:
        - name: peer
          image: 130.233.195.35:5000/p2p-attestation@sha256:9641c0adcdf686cfab28881d06f9257215046488c3a34b7c6fcc77c55a96a238
          command: ["./peer"]
          args: ["--id=$(POD_NAME)"]
          env:
            - name: POD_NAME
              valueFrom: { fieldRef: { fieldPath: metadata.name } }
            - name: REST_PORT
              value: "8888"
          securityContext: { runAsUser: 1337, runAsGroup: 1337 }
          resources:
            requests: { cpu: 20m, memory: 64Mi }
            limits: { cpu: 150m, memory: 128Mi }
          ports: [{ containerPort: 5001 }, { containerPort: 8443 }]
          volumeMounts:
            - { name: config-dir, mountPath: /app/config, readOnly: true }
            - { name: certs-vol, mountPath: /certs }
        - name: envoy
          image: 130.233.195.35:5000/envoy@sha256:e5e530a61bb1ce655fa4a8ec567497112fcad296cb40ef00382ac575e8bd5e64
          command: ["/bin/bash", "-c"]
          args:
            - |
              until (exec 3<>/dev/tcp/127.0.0.1/8888 &&
                     printf "GET /.well-known/attestation HTTP/1.0\r\nHost: 127.0.0.1\r\n\r\n" >&3 &&
                     read -r line <&3 && exec 3>&- &&
                     [[ "$line" == *"200"* ]]) 2>/dev/null; do
                echo "[envoy] waiting for attestation..."; sleep 2
              done
              exec envoy -c /etc/envoy/envoy.yaml --service-node "$POD_NAME" --service-cluster store-front
          env:
            - name: POD_NAME
              valueFrom: { fieldRef: { fieldPath: metadata.name } }
          securityContext: { runAsUser: 1337, runAsGroup: 1337 }
          resources:
            requests: { cpu: 30m, memory: 64Mi }
            limits: { cpu: 300m, memory: 128Mi }
          ports:
            [
              { containerPort: 9090 },
              { containerPort: 9443 },
              { containerPort: 15006 },
              { containerPort: 15001 },
              { containerPort: 9901 },
            ]
          volumeMounts:
            - { name: envoy-config, mountPath: /etc/envoy, readOnly: true }
            - { name: certs-vol, mountPath: /certs, readOnly: true }
        - name: store-front
          image: 130.233.195.35:5000/store-front@sha256:6768ac28c10d09556fd45868b87f66c3642608f4939376ef9f810aeb5af237cf
          ports: [{ containerPort: 8080, name: store-front }]
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { cpu: 200m, memory: 128Mi }
      volumes:
        - { name: config-dir, configMap: { name: shared-config } }
        - { name: envoy-config, configMap: { name: envoy-config-store-front } } # HTTP template, app port 8080
        - { name: certs-vol, emptyDir: {} }
---
apiVersion: v1
kind: Service
metadata: { name: store-front-protocol-service }
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector: { app: store-front }
  ports: [{ port: 5001 }]
---
apiVersion: v1
kind: Service
metadata: { name: store-front }
spec:
  type: LoadBalancer
  selector: { app: store-front }
  ports:
    - { name: preflight, port: 9090, targetPort: 9090 }
    - { name: external-tls, port: 443, targetPort: 9443 }


