version = "0.1.0"
algorithm = "sha384"

# Policy for pod 'order-service'. Admits the shared infrastructure containers and only
# this pod's application image (order-service). Generated by generate_store_policies.py.

[data]
"policy.rego" = '''
package agent_policy
import rego.v1

# Allow management operations
default CreateSandboxRequest := true
default DestroySandboxRequest := true
default GuestDetailsRequest := true
default StartContainerRequest := true
default StatsContainerRequest := true

# Process-level operations (permissive in the prototype; restrict for production)
default ExecProcessRequest := true
default SignalProcessRequest := true
default WaitProcessRequest := true
default GetOOMEventRequest := true

# Container creation is denied unless explicitly allowed below
default CreateContainerRequest := true
default UpdateInterfaceRequest := true
default UpdateRoutesRequest := true
default CopyFileRequest := true
default ReadStreamRequest := true #allow logs

# Sandbox pause container.
CreateContainerRequest if {
	input.OCI.Process.Args == ["/pause"]
}

# iptables init container.
CreateContainerRequest if {
	some storage in input.storages
	storage.source == "130.233.195.35:5000/iptables-init@sha256:a33779d0e8e49bd4a65debae3b6833da4d090a2be0d24064014159889be94e67"
	input.OCI.Process.Args == ["/iptables-redirect.sh"]
}

# Attestation sidecar: ./peer --id=<pod-id>.
CreateContainerRequest if {
	some storage in input.storages
	storage.source == "130.233.195.35:5000/p2p-attestation@sha256:9641c0adcdf686cfab28881d06f9257215046488c3a34b7c6fcc77c55a96a238"
	count(input.OCI.Process.Args) == 2
	input.OCI.Process.Args[0] == "./peer"
	regex.match(`^--id=[a-z0-9]+-[0-9]+$`, input.OCI.Process.Args[1])
}

# Envoy: bash with the attestation-gate poll loop (matched structurally).
CreateContainerRequest if {
	some storage in input.storages
	storage.source == "130.233.195.35:5000/envoy@sha256:e5e530a61bb1ce655fa4a8ec567497112fcad296cb40ef00382ac575e8bd5e64"
	count(input.OCI.Process.Args) == 3
	input.OCI.Process.Args[0] == "/bin/bash"
	input.OCI.Process.Args[1] == "-c"
	contains(input.OCI.Process.Args[2], "/.well-known/attestation")
	contains(input.OCI.Process.Args[2], "exec envoy -c /etc/envoy/envoy.yaml")
}

# Application image for this pod.
CreateContainerRequest if {
	some storage in input.storages
	storage.source == "130.233.195.35:5000/order-service@sha256:d7da06f86809c3581d07f53afce47200b607a802885a76d63d8bb59a26667765"
	input.OCI.Process.Args == ["docker-entrypoint.sh", "npm", "start"]
}
'''

